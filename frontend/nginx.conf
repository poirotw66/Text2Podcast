# Serves the Vite-built SPA. This app uses React Router (client-side routing
# for /edit/:taskId, /confirm/:taskId, /result/:taskId, /settings, etc.), so
# any path nginx doesn't have a matching static file for must fall back to
# index.html -- otherwise a hard refresh or a shared deep link on any route
# but "/" 404s instead of letting the router take over.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames (dist/assets/*-<hash>.js) are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
