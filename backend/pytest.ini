[pytest]
testpaths = tests
# Adds backend/ (this file's directory) to sys.path so `import app...` resolves
# with plain `pytest` run from backend/ -- no PYTHONPATH env var required.
pythonpath = .
addopts = -ra --timeout=120 --strict-markers
# Safety net: any single test stuck for 2 minutes (e.g. a hung SSE stream or a
# retry loop that started sleeping) fails loudly instead of hanging CI forever.
timeout = 120
